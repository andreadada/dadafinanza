name: Temporary format fix

on:
  push:
    branches:
      - build/fix-settings-dashboard-20260906

permissions:
  contents: write

concurrency:
  group: format-fix-package-config-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve package language versions
        run: flutter pub get
      - name: Format changed Dart sources
        run: >-
          dart format
          lib/screens/category_management_screen.dart
          lib/screens/home_screen.dart
          lib/screens/preset_management_screen.dart
          lib/screens/rules_management_screen.dart
          lib/widgets/full_page_empty_state.dart
          lib/widgets/home_dashboard_widget.dart
          test/csv_service_test.dart
          test/home_personalization_test.dart
      - name: Commit formatting when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/screens/category_management_screen.dart \
            lib/screens/home_screen.dart \
            lib/screens/preset_management_screen.dart \
            lib/screens/rules_management_screen.dart \
            lib/widgets/full_page_empty_state.dart \
            lib/widgets/home_dashboard_widget.dart \
            test/csv_service_test.dart \
            test/home_personalization_test.dart
          git commit -m "style: format dashboard fixes with package config"
          git push origin "HEAD:${GITHUB_REF_NAME}"
