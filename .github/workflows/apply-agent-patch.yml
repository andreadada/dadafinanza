name: Apply agent patch

on:
  push:
    branches:
      - build/initial-flutter-app
    paths:
      - patches/goal-ledger.patch

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply implementation patch
        run: |
          git apply --check patches/goal-ledger.patch
          git apply patches/goal-ledger.patch
          git rm patches/goal-ledger.patch
          git config user.name "DadaFinanza Agent"
          git config user.email "63845798+andreadada@users.noreply.github.com"
          git add -A
          git commit -m "feat: add goal ledger and budget-aware planning"
          git push origin HEAD:build/initial-flutter-app
