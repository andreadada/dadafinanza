name: Apply voice UX patch

on:
  push:
    branches:
      - build/voice-listening-ux

permissions:
  contents: write

concurrency:
  group: apply-voice-ux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[voice-ux-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 tool/apply_voice_listening_ux.py
      - name: Format Dart
        run: dart format lib test
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test docs/LINEE_GUIDA_STYLE.md
          git commit -m "feat: refine voice listening UX [voice-ux-applied]"
          git push
