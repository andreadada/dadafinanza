name: Temporary haptic format diagnostics

on:
  push:
    branches:
      - 'build/fix-haptic-feedback'

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format target
        run: dart format lib/screens/personal_settings_screen.dart
      - name: Show formatter diff
        run: git diff -- lib/screens/personal_settings_screen.dart
