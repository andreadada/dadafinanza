name: Fix transfer label

on:
  push:
    branches:
      - build/voice-listening-ux

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[transfer-label-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python3 tool/fix_transfer_label.py
      - run: dart format lib/screens/quick_add_page.dart test/voice_listening_ux_contract_test.dart
      - name: Commit final fix and remove temporary files
        run: |
          rm tool/fix_transfer_label.py .github/workflows/fix-transfer-label.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep transfer label on one line [transfer-label-fixed]"
          git push
