name: Build Release APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag o commit da compilare"
        required: true
        default: "build/initial-flutter-app"
        type: string

concurrency:
  group: release-apk-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk DadaFinanza-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: DadaFinanza-release-apk
          path: DadaFinanza-release.apk
          if-no-files-found: error
          retention-days: 7
