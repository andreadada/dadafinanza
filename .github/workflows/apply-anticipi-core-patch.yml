name: Apply Anticipi core patch

on:
  push:
    branches:
      - build/anticipi-ledger
    paths:
      - tooling/apply_anticipi_core_patch.py
      - tooling/fix_anticipi_core_patch.py
      - tooling/trigger_anticipi_core_patch

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Repair patch script
        run: python tooling/fix_anticipi_core_patch.py
      - name: Apply patch
        run: python tooling/apply_anticipi_core_patch.py
      - name: Resolve packages
        run: flutter pub get
      - name: Format Dart sources
        run: dart format lib test
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test tooling/apply_anticipi_core_patch.py
          git commit -m "feat: integrate Anticipi ledger core"
          git push
