name: Temporary home formatter apply

on:
  push:
    branches:
      - 'build/fix-home-dashboard-wiring'

permissions:
  contents: write

jobs:
  format-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/fix-home-dashboard-wiring
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format targets
        run: dart format lib/screens/account_context_home_screen.dart test/home_dashboard_wiring_test.dart
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet -- lib/screens/account_context_home_screen.dart test/home_dashboard_wiring_test.dart; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "Dada"
          git config user.email "63845798+andreadada@users.noreply.github.com"
          git add lib/screens/account_context_home_screen.dart test/home_dashboard_wiring_test.dart
          git commit -m "style: format home dashboard wiring"
          git push origin HEAD:build/fix-home-dashboard-wiring
