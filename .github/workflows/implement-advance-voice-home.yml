name: Implement advance voice and home improvements

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: implement-advance-voice-home
  cancel-in-progress: true

jobs:
  implement:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Apply implementation
        run: python3 tooling/apply_advance_voice_home.py
      - name: Format
        run: dart format lib test
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Commit implementation
        run: |
          if git diff --quiet; then
            echo "No implementation changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "feat: improve advances voice math and home sections"
          git push origin HEAD:main
