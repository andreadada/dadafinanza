name: Flutter validation

on:
  push:
    branches:
      - main
      - 'build/**'

permissions:
  contents: write

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Apply source repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          canonical = Path('lib/screens/canonical_shell.dart')
          s = canonical.read_text()
          s = s.replace("""              if (state.userAccounts.isEmpty) ...[
                _SetupBlock(state: state),
                const SizedBox(height: 28),
              ],
""", "")
          s = re.sub(
              r"\nclass _SetupBlock extends StatelessWidget \{.*?\n\}\n\nclass _HomeInsight",
              "\nclass _HomeInsight",
              s,
              flags=re.S,
          )
          canonical.write_text(s)

          parser = Path('lib/services/voice_transaction_parser.dart')
          s = parser.read_text()
          replacement = r'''  _EntityMatch _matchEntity<T>(
    String input,
    List<T> items,
    String Function(T item) label,
    int Function(T item) id,
  ) {
    final entityInput = input
        .replaceAll(RegExp(r'[,.]+'), ' ')
        .replaceAll(RegExp(r'\s+'), ' ')
        .trim();

    final exact = <_ScoredEntity<T>>[];
    for (final item in items) {
      final name = _normalize(label(item));
      if (name.isEmpty) continue;
      final phrase = RegExp(r'(?:^| )' + RegExp.escape(name) + r'(?: |$)');
      if (phrase.hasMatch(entityInput)) {
        exact.add(_ScoredEntity(item, name, 1));
      }
    }

    if (exact.isNotEmpty) {
      exact.sort((a, b) => b.name.length.compareTo(a.name.length));
      final longest = exact.first;
      if (exact.length > 1) {
        final nested = exact.every(
          (candidate) => candidate.name == longest.name ||
              longest.name.startsWith('${candidate.name} '),
        );
        if (nested) return _EntityMatch(id: id(longest.item));
        return _EntityMatch(
          ambiguous: true,
          candidates: exact.map((item) => id(item.item)).toList(),
        );
      }

      final prefixAlternatives = <int>[];
      for (final item in items) {
        if (identical(item, longest.item)) continue;
        final name = _normalize(label(item));
        if (name.startsWith('${longest.name} ')) {
          prefixAlternatives.add(id(item));
        }
      }
      if (prefixAlternatives.isNotEmpty) {
        return _EntityMatch(
          ambiguous: true,
          candidates: [id(longest.item), ...prefixAlternatives],
        );
      }
      return _EntityMatch(id: id(longest.item));
    }

    final scored = <_ScoredEntity<T>>[];
    for (final item in items) {
      final name = _normalize(label(item));
      if (name.isEmpty) continue;
      final score = _entityScore(entityInput, name);
      if (score >= .72) scored.add(_ScoredEntity(item, name, score));
    }
    if (scored.isEmpty) return const _EntityMatch();
    scored.sort((a, b) => b.score.compareTo(a.score));
    final top = scored.first;
    final close = scored.where((item) => top.score - item.score < .12).toList();
    if (close.length > 1) {
      return _EntityMatch(
        ambiguous: true,
        candidates: close.map((item) => id(item.item)).toList(),
      );
    }
    return _EntityMatch(id: id(top.item));
  }

  double _entityScore(String input, String name) {
    final phrase = RegExp(r'(?:^| )' + RegExp.escape(name) + r'(?: |$)');
    if (phrase.hasMatch(input)) return 1;
    final nameTokens = name.split(' ').where((item) => item.length > 1).toSet();
    if (nameTokens.isEmpty) return 0;
    final inputTokens = input.split(' ').toSet();
    final overlap =
        nameTokens.where(inputTokens.contains).length / nameTokens.length;
    if (overlap == 1) return nameTokens.length > 1 ? .92 : .88;
    return overlap * .78;
  }

  _TransferMatch _matchTransferAccounts'''
          s = re.sub(
              r"  _EntityMatch _matchEntity<T>\(.*?\n  _TransferMatch _matchTransferAccounts",
              replacement,
              s,
              flags=re.S,
          )
          s = s.replace("""    if (original.contains(',')) {
      final tail = original.split(',').last.trim();
      if (tail.length >= 2 &&
          !_containsOnlyKnownEntity(tail, accounts, categories)) {
        return tail;
      }
    }
""", """    if (original.contains(',')) {
      final tail = original.split(',').last.trim();
      if (tail.length >= 2) return tail;
    }
""")
          s = re.sub(
              r"\n  bool _containsOnlyKnownEntity\(.*?\n  \}\n\n  bool _containsAny",
              "\n  bool _containsAny",
              s,
              flags=re.S,
          )
          parser.write_text(s)
          PY
          dart format lib test
      - name: Persist repaired sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          if ! git diff --cached --quiet; then
            git commit -m "fix: stabilize voice parsing and zero-data home"
            git push origin HEAD:${{ github.ref_name }}
          fi
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dadafinanza-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
