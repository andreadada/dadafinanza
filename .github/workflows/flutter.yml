name: Flutter validation

on:
  push:
    branches:
      - main
      - 'build/**'

permissions:
  contents: write

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Apply source repairs
        run: |
          echo '' | base64 -d > /tmp/fix_sources.py
          python3 /tmp/fix_sources.py
          dart format lib test
      - name: Persist repaired sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          if ! git diff --cached --quiet; then
            git commit -m "fix: stabilize voice parsing and zero-data home"
            git push origin HEAD:${{ github.ref_name }}
          fi
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dadafinanza-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
