name: Finalize Anticipi

on:
  push:
    branches:
      - build/anticipi-ledger
    paths:
      - .github/workflows/finalize-anticipi.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply backup testability patch
        run: python tooling/patch_backup_testability.py
      - name: Resolve packages
        run: flutter pub get
      - name: Format Dart sources
        run: dart format lib test
      - name: Commit test hardening
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test pubspec.yaml pubspec.lock
          git commit -m "test: harden Anticipi and backup coverage"
          git push
