name: Build verified release APK once

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    if: ${{ github.actor != 'github-actions[bot]' }}
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release
      - name: Verify APK
        run: test -f build/app/outputs/flutter-apk/app-release.apk
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk DadaFinanza-release.apk
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: DadaFinanza-release-apk
          path: DadaFinanza-release.apk
          if-no-files-found: error
          retention-days: 7
